# ========================================================
# 		AUTHID MANAGEMENT
# ========================================================

# ClientID types (for cid_* options)
#   1: Real (or generated by HW) steam (STEAM_xx:xx:xx)
#   2: Real (or generated by HW) valve (VALVE_xx:xx:xx)
#   3: STEAM_ by IP
#   4: VALVE_ by IP
#   5: Deprecated - client will be rejected
#   7: HLTV
#   8: STEAM_ID_LAN
#   9: STEAM_ID_PENDING
#   10: VALVE_ID_LAN
#   11: VALVE_ID_PENDING
#   12: STEAM_666:88:666

### AUTH CONTROL ###

cid_Steam = 1
cid_SteamPending = 5
cid_HLTV = 5
cid_NoSteam47 = 2
cid_NoSteam48 = 5
cid_RevEmu = 1
cid_RevEmu2013 = 1
cid_SC2009 = 1
cid_OldRevEmu = 1
cid_SteamEmu = 1
cid_AVSMP = 1
cid_Setti = 3
cid_SXEI = 1


### AUTH SETTINGS ###

# Versión de autenticación recomendada (v4)
AuthVersion = 4

# ¡IMPORTANTE! Clave de encriptación requerida para la v4 (evita crasheos y protege SteamIDs)
SteamIdHashSalt = MiClaveSecretaZombiePlague2026_xyz987

SC2009_RevCompatMode = 1
EnableSXEIdGeneration = 0
EnableGenPrefix2 = 0
HLTVExcept_IP = 127.0.0.1


### AUTHID PREFIXES (Ignorados si AuthVersion > 2, se dejan por compatibilidad) ###

IPGen_Prefix1 = 0
IPGen_Prefix2 = 4
Native_Prefix1 = 0
RevEmu_Prefix1 = 1
RevEmu2013_Prefix1 = 1
SC2009_Prefix1 = 1
OldRevEmu_Prefix1 = 2
SteamEmu_Prefix1 = 3
AVSMP_Prefix1 = 4
Setti_Prefix1 = 5
SXEI_Prefix1 = 6


# ========================================================
# 		SERVER QUERIES MANAGEMENT
# ========================================================

ServerInfoAnswerType = 0
FixBuggedQuery = 1
EnableQueryLimiter = 1
QueryFloodBanLevel = 400
QueryFloodBanTime = 10

[QueryLimiterExceptIP]
#127.0.0.1

AllowSplitPackets = 0
IDClientsLimit = 1


# ========================================================
# 		OTHER STUFF
# ========================================================

LoggingMode = 1